name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bb
          POSTGRES_PASSWORD: bb
          POSTGRES_DB: brokerbuddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bb" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://bb:bb@localhost:5432/brokerbuddy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); AGP downloads any missing
      # platform/build-tools itself. (android-actions/setup-android@v3 fails installing the
      # removed legacy "tools" package.)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: brokerbuddy-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Lint
        run: |
          ./gradlew --no-daemon :app:lintDebug || {
            echo "::group::Lint errors"
            grep -A4 ": Error:" app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
            echo "::endgroup::"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/core/build/reports
