name: Emulator smoke test

# Installs the debug app on an Android emulator and checks that it starts and the offline demo opens
# with its sample data. Runs by hand (Actions → Emulator smoke test → Run workflow, once this file is
# on the default branch) or when the smoke test itself changes — not on every push, to save minutes.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/smoke.yml
      - android/app/src/androidTest/**

jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the demo on an emulator (Android 11)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-test-reports
          path: android/app/build/reports/androidTests
          if-no-files-found: warn
